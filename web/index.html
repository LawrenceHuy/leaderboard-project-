<!doctype html>
<html><head><meta charset="utf-8"><title>Leaderboard</title>
<style>body{font-family:sans-serif;max-width:480px;margin:40px auto}
td,th{padding:6px 12px;text-align:left}tr:nth-child(even){background:#f3f3f3}</style></head>
<body><h2>Top 10</h2><table id="t"></table><small id="u"></small>
<script>
const API_URL = "__API_URL__";
async function load(){
  try{
    const d = await (await fetch(API_URL)).json();
    document.getElementById("t").innerHTML =
      "<tr><th>#</th><th>Player</th><th>Score</th></tr>" +
      d.top.map((p,i)=>"<tr><td>"+(i+1)+"</td><td>"+p.playerId+"</td><td>"+p.score+"</td></tr>").join("");
    document.getElementById("u").textContent = "Cap nhat: " + (d.updatedAt||"-");
  }catch(e){ console.error(e); }
}
load(); setInterval(load, 3000);
</script></body></html>
